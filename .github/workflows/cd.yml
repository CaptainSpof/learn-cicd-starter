name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      CLOUDSDK_CORE_PROJECT: lively-tensor-506815-g4
      CLOUDSDK_RUN_REGION: us-central1
      AR_REPO: notely-ar-repo
      SERVICE: notely

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build binary
        run: bash ./scripts/buildprod.sh

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      # Assembled once and exported for the remaining steps, so the registry
      # path is never spelled out twice.
      - name: Compose image tag
        run: |
          echo "IMAGE=${CLOUDSDK_RUN_REGION}-docker.pkg.dev/${CLOUDSDK_CORE_PROJECT}/${AR_REPO}/${SERVICE}:latest" >> "$GITHUB_ENV"

      - name: Deploy docker image to artifact registry
        run: gcloud builds submit --tag "$IMAGE" .

      - name: Deploy to Cloud Run
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --allow-unauthenticated --max-instances=4
